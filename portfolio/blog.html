  <script>
    // ── STATIC FALLBACK DATA ──
    const STATIC_BLOGS = [
      { title: 'How I Built a Fake UPI Screenshot Detector using OCR & FastAPI', date: 'MAY 2026', category: 'ARCHITECTURE', tags: ['Computer Vision', 'System Design'], excerpt: 'A deep dive into the engineering decisions behind a fraud detection system, analyzing image manipulation artifacts using Tesseract and Python.' },
      { title: 'Flask vs FastAPI: Benchmarking for AI Applications', date: 'APR 2026', category: 'BACKEND', tags: ['FastAPI', 'Performance'], excerpt: 'When deploying machine learning models, async I/O matters. Here is a performance breakdown between Flask and FastAPI under heavy ML inference loads.' },
      { title: 'Optimizing Matrix Operations for Faster Model Inference', date: 'MAR 2026', category: 'MACHINE LEARNING', tags: ['Mathematics', 'NumPy'], excerpt: 'Exploring mathematical hacks and linear algebra shortcuts to reduce computational overhead in statistical models.' },
      { title: 'Building End-to-End Machine Learning Systems', date: 'FEB 2026', category: 'ENGINEERING', tags: ['MLOps', 'Architecture'], excerpt: 'Why Jupyter Notebooks are not enough. A guide to transitioning from exploratory data analysis to production-ready deployment.' }
    ];

    function buildBlogCard(post, isFirestore) {
      const tags = (post.tags || []).map(t => `<span class="ptag">${t}</span>`).join('');
      const link = (isFirestore && post.id)
        ? `blog-post.html?id=${post.id}`
        : (post.slug ? `blog-post.html?id=${post.id}` : '#');

      return `
        <article class="blog-card reveal">
          <div class="blog-meta">${post.date || ''} · ${post.category || ''}</div>
          <h2 class="blog-title"><a href="${link}">${post.title}</a></h2>
          <p class="blog-excerpt">${post.excerpt || ''}</p>
          <div class="blog-tags">${tags}</div>
        </article>`;
    }

    function renderBlogs(list, isFirestore) {
      const container = document.getElementById('blogList');
      const published = isFirestore ? list.filter(b => b.published !== false) : list;
      if (!published.length) {
        container.innerHTML = '<p style="color:var(--muted); padding:2rem 0;">No posts published yet.</p>';
        return;
      }
      container.innerHTML = published.map(b => buildBlogCard(b, isFirestore)).join('');
      container.querySelectorAll('.reveal').forEach(el => observer && observer.observe(el));
    }

    async function loadBlogs() {
      try {
        const snap = await db.collection('blogs').get();
        if (snap.empty) { renderBlogs(STATIC_BLOGS, false); return; }
        const blogs = snap.docs
          .map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => {
            const ta = a.createdAt?.toMillis?.() || 0;
            const tb = b.createdAt?.toMillis?.() || 0;
            return tb - ta;
          });
        renderBlogs(blogs, true);
      } catch (e) {
        // Firebase not configured — use static fallback
        renderBlogs(STATIC_BLOGS, false);
      }
    }

    loadBlogs();
  </script>
