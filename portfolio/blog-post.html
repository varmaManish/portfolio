    .post-content ul, .post-content ol {

    .post-content blockquote {

  <script>
    async function loadPost() {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');

      if (!postId) { showNotFound(); return; }

      try {
        const doc = await db.collection('blogs').doc(postId).get();
        if (!doc.exists) { showNotFound(); return; }

        const post = { id: doc.id, ...doc.data() };

        // Update page meta
        document.title = post.title + ' | Manish Varma';
        document.querySelector('meta[name="description"]').content = post.excerpt || '';

        // Render post
        const tags = (post.tags || []).map(t =>
          `<span class="ptag">${t}</span>`
        ).join('');

        document.getElementById('postLayout').innerHTML = `
          <a href="blog.html" class="post-back">← All Articles</a>
          <div class="post-meta">
            <span>${post.date || ''}</span>
            ${post.category ? `<span>· ${post.category}</span>` : ''}
          </div>
          <h1 class="post-title">${post.title}</h1>
          ${post.excerpt ? `<p class="post-excerpt">${post.excerpt}</p>` : ''}
          ${tags ? `<div class="post-tags">${tags}</div>` : ''}
          <div class="post-content" id="postContent"></div>
          <hr class="post-divider">
          <div class="post-nav">
            <a href="blog.html" class="btn-warm btn-stroke btn-sm">← Back to Blog</a>
            <a href="index.html#contact" class="btn-warm btn-fill btn-sm">Get in Touch →</a>
          </div>
        `;

        // Safely render HTML content
        document.getElementById('postContent').innerHTML = post.content || '<p>Content coming soon.</p>';

      } catch (e) {
        showNotFound('Could not load this post. ' + e.message);
      }
    }

    function showNotFound(msg) {
      document.getElementById('postLayout').innerHTML = `
        <div class="not-found">
          <h2>Post not found</h2>
          <p>${msg || 'This article may have been moved or deleted.'}</p>
          <a href="blog.html" class="btn-warm btn-fill">← Back to Blog</a>
        </div>
      `;
    }

    loadPost();
  </script>
